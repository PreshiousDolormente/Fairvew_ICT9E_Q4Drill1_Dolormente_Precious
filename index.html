<!DOCTYPE html> 
<html lang="en"> 
<head>     
<meta charset="UTF-8">     
<meta name="viewport" content="width=device-width, initial-scale=1.0">     
<title>Q4Drill1</title>      

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head> 
<body>     

    <h1>JavaScript Conditional Statements</h1>     
    <!--comment-->     

    <input type="text" id="EE" class="form-control"
    placeholder="type here...">     

    <button class="btn btn-info" onclick="checkEE()">Check</button>     

        <script>         
        function checkEE(){             
        var EE = document.getElementById("EE").value;         

        if(isNaN(EE) || EE < 0){             
        alert("Please input a valid number.");         
        }         
        else if(EE <= 100){              
        alert("Lifeline Consumer");         
        }         
        else if(EE <= 200){             
        alert("Low Consumption");         
        }
        else if(EE <= 300){             
        alert("Average Consumption");         
        } 
        else if(EE <= 500){             
        alert("High Consumption");         
        }           
        else{             
        alert("Very High Consumption.");         
        }      
        }     
</script> 

</body> 
</html>
