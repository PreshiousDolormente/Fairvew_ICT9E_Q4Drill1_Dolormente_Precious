<!DOCTYPE html> 
<html lang="en"> 
<head>     
<meta charset="UTF-8">     
<meta name="viewport" content="width=device-width, initial-scale=1.0">     
<title>Q4Drill1</title>      

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head> 
<body>   
    <style>
        body{
         background-image: url(https://i.pinimg.com/736x/49/80/76/4980760dbdeedf245fba9ee54a112b9d.jpg);
         background-size: cover;
        }
       h2{
        text-align: center;
        font-family: Georgia, 'Times New Roman', Times, serif;
       }
       .form-box{
        background-color: rgba(198, 73, 148, 0.4);
        border-radius: 15px;
        padding: 30px;
        margin-top: 50px;
        width: 450px;
        margin: auto;
       }
       .btn{
        color: rgb(232, 178, 217);
        background-color: rgb(143, 83, 115);
       }
    
    </style>  

<div class="form-box mt-5">

    <h2>Electricity Consumption Classifier</h2>      

    <input type="text" id="EE" class="form-control"
    placeholder="type here...">     

    <button class="btn mt-4" onclick="checkEE()">Check</button>   
</div>

        <script>         
        function checkEE(){             
        var EE = document.getElementById("EE").value;         

        if(isNaN(EE) || EE < 0){             
        alert("Please input a valid number.");         
        }         
        else if(EE <= 100){              
        alert("Lifeline Consumer");         
        }         
        else if(EE <= 200){             
        alert("Low Consumption");         
        }
        else if(EE <= 300){             
        alert("Average Consumption");         
        } 
        else if(EE <= 500){             
        alert("High Consumption");         
        }           
        else{             
        alert("Very High Consumption.");         
        }      
        }     
</script> 



</body> 
</html>
